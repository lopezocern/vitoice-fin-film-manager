$('#types').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;state.type=b.dataset.type;$$('.type-tab').forEach(x=>x.classList.toggle('active',x===b));renderLibrary()};$$('[data-quick]').forEach(b=>b.onclick=()=>{state.quick=b.dataset.quick;$$('[data-quick]').forEach(x=>x.classList.toggle('active',x===b));renderLibrary()});$$('[data-tag]').forEach(b=>b.onclick=()=>{const t=b.dataset.tag;state.tags=state.tags.includes(t)?state.tags.filter(x=>x!==t):[...state.tags,t];b.classList.toggle('active',state.tags.includes(t));renderLibrary()});['genre','country','year'].forEach(id=>$('#'+id).onchange=renderLibrary);$('#views').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;$$('#views button').forEach(x=>x.classList.toggle('active',x===b));renderLibrary()};$('#density').oninput=e=>{document.documentElement.style.setProperty('--density',e.target.value+'px')};$('#clear').onclick=()=>{$$('#genre,#country,#year').forEach(x=>x.value='');state.quick='all';state.tags=[];$$('[data-quick]').forEach(x=>x.classList.toggle('active',x.dataset.quick==='all'));$$('[data-tag]').forEach(x=>x.classList.remove('active'));renderLibrary()};
$('#openSearch').onclick=()=>openSearch();$('#searchInput').oninput=renderSearch;$$('.recent-query').forEach(b=>b.onclick=()=>{$('#searchInput').value=b.textContent;renderSearch()});$('#searchModal').onclick=e=>{if(e.target===$('#searchModal'))$('#searchModal').classList.remove('open')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')$('#searchModal').classList.remove('open')});$('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};$$('[data-window]').forEach(b=>b.onclick=()=>notify(`${b.dataset.window}窗口（设计稿演示）`));
$('#shuffleRecommendations').onclick=()=>{renderRecommendations();notify('已换一批推荐内容')};$('#openSearch').onclick=()=>openSearch();$('#searchInput').oninput=renderSearch;$$('.recent-query').forEach(b=>b.onclick=()=>{$('#searchInput').value=b.textContent;renderSearch()});$('#searchModal').onclick=e=>{if(e.target===$('#searchModal'))$('#searchModal').classList.remove('open')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')$('#searchModal').classList.remove('open')});$('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};$$('[data-window]').forEach(b=>b.onclick=()=>notify(`${b.dataset.window}窗口（设计稿演示）`));
renderCenter();renderLibrary();lucide.createIcons();
