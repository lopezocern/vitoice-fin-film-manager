[package]
name = "vitoice"
version = "3.0.0"
description = "vitoice - 桌面媒体素材管理应用"
authors = ["vitoice"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
# 替代 tauri-plugin-shell 的 open()（后者自 2.1.0 起 deprecated）：
# shell.open 默认仅放行 mailto/tel/http(s)，本地目录路径会被作用域正则拒绝。
# opener 将 URL 与本地路径拆成 openUrl / openPath 两个独立 API 与权限。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 生产构建（tauri build / cargo build --features custom-protocol）内嵌前端资产，
# 缺了它 release exe 会去连 devUrl(127.0.0.1:5173) → 白屏 ERR_CONNECTION_REFUSED
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
